# Dev EC2 stack: Spring Boot + PostgreSQL (nginx on the host proxies :80 → app:8080)
services:
  postgres:
    image: postgres:16-alpine
    container_name: gamya-couture-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamya_couture}
      POSTGRES_USER: ${DB_USER:-gamya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - gamya_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gamya} -d ${POSTGRES_DB:-gamya_couture}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: gamya-couture-app:${IMAGE_TAG:-latest}
    container_name: gamya-couture-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gamya_couture}
      DB_USER: ${DB_USER:-gamya}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

volumes:
  gamya_pg_data:
