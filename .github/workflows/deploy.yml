name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  AWS_REGION: ap-south-1
  APP_PATH: /opt/gamya-couture
  DEPLOY_OBJECT_KEY: incoming/gamya-couture.jar
  DEPLOY_SCRIPT_KEY: incoming/remote-deploy.sh
  DEPLOY_SYNC_SCRIPT_KEY: incoming/sync-rds-env-from-ssm.sh

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build-and-deploy:
    name: Deploy to EC2
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR (tests already passed in validate job)
        run: mvn -B -ntp -DskipTests package

      - name: Resolve JAR path
        id: jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name 'gamya-couture-*.jar' ! -name '*-original.jar' | head -1)
          if [[ -z "$JAR_PATH" || ! -f "$JAR_PATH" ]]; then
            echo "Executable JAR not found under target/" >&2
            exit 1
          fi
          echo "path=${JAR_PATH}" >> "$GITHUB_OUTPUT"
          echo "Resolved JAR: ${JAR_PATH} ($(du -h "$JAR_PATH" | cut -f1))"

      - name: Resolve deploy configuration
        id: deploy_cfg
        env:
          AWS_BACKEND_DEPLOY_ROLE_ARN: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          DEPLOY_BUCKET_VAR: ${{ vars.DEPLOY_BUCKET }}
          DEPLOY_BUCKET_SECRET: ${{ secrets.DEPLOY_BUCKET }}
          EC2_INSTANCE_ID_VAR: ${{ vars.EC2_INSTANCE_ID }}
          EC2_INSTANCE_ID_SECRET: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_HOST_VAR: ${{ vars.EC2_HOST }}
          EC2_HOST_SECRET: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          pick_non_empty() {
            local a="$1"
            local b="$2"
            if [[ -n "${a//[[:space:]]/}" ]]; then
              echo "$a"
            else
              echo "$b"
            fi
          }

          DEPLOY_BUCKET="$(pick_non_empty "$DEPLOY_BUCKET_VAR" "$DEPLOY_BUCKET_SECRET")"
          EC2_INSTANCE_ID="$(pick_non_empty "$EC2_INSTANCE_ID_VAR" "$EC2_INSTANCE_ID_SECRET")"
          EC2_HOST="$(pick_non_empty "$EC2_HOST_VAR" "$EC2_HOST_SECRET")"

          missing=()
          [[ -z "${AWS_BACKEND_DEPLOY_ROLE_ARN//[[:space:]]/}" ]] && missing+=(AWS_BACKEND_DEPLOY_ROLE_ARN)
          [[ -z "${DEPLOY_BUCKET//[[:space:]]/}" ]] && missing+=(DEPLOY_BUCKET)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=Missing deploy config::Set AWS_BACKEND_DEPLOY_ROLE_ARN and DEPLOY_BUCKET in GitHub Actions secrets/variables." >&2
            exit 1
          fi

          if [[ -z "${EC2_INSTANCE_ID//[[:space:]]/}" ]]; then
            echo "EC2_INSTANCE_ID not set — will resolve from AWS by instance Name tag during deploy."
          fi
          if [[ -z "${EC2_HOST//[[:space:]]/}" ]]; then
            echo "EC2_HOST not set — will resolve current public IP from AWS during deploy."
          fi

          echo "deploy_bucket=${DEPLOY_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "ec2_instance_id=${EC2_INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "ec2_host=${EC2_HOST}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare EC2 deploy target
        id: ec2_target
        env:
          DEPLOY_BUCKET: ${{ steps.deploy_cfg.outputs.deploy_bucket }}
          CONFIGURED_INSTANCE_ID: ${{ steps.deploy_cfg.outputs.ec2_instance_id }}
        run: |
          set -euo pipefail
          EC2_INSTANCE_ID="${CONFIGURED_INSTANCE_ID//[[:space:]]/}"
          NAME_PREFIX="${DEPLOY_BUCKET%-backend-deploy}"
          if [[ "${NAME_PREFIX}" == "${DEPLOY_BUCKET}" ]]; then
            NAME_PREFIX="${DEPLOY_BUCKET%-deploy}"
          fi
          EC2_NAME_TAG="${NAME_PREFIX}-api"

          instance_state() {
            aws ec2 describe-instances \
              --region "${AWS_REGION}" \
              --instance-ids "$1" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text 2>/dev/null || echo "missing"
          }

          resolve_by_name_tag() {
            aws ec2 describe-instances \
              --region "${AWS_REGION}" \
              --filters \
                "Name=tag:Name,Values=${EC2_NAME_TAG}" \
                "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'sort_by(Reservations[].Instances[], &LaunchTime)[-1].InstanceId' \
              --output text
          }

          if [[ -z "${EC2_INSTANCE_ID}" ]]; then
            echo "Resolving EC2 instance by tag Name=${EC2_NAME_TAG}"
            EC2_INSTANCE_ID="$(resolve_by_name_tag)"
            if [[ -z "${EC2_INSTANCE_ID}" || "${EC2_INSTANCE_ID}" == "None" ]]; then
              echo "::error::No EC2 instance found with tag Name=${EC2_NAME_TAG}." >&2
              exit 1
            fi
          fi

          STATE="$(instance_state "${EC2_INSTANCE_ID}")"
          if [[ "${STATE}" == "missing" || "${STATE}" == "None" || "${STATE}" == "terminated" ]]; then
            echo "Configured EC2_INSTANCE_ID ${EC2_INSTANCE_ID} is ${STATE}; resolving latest instance with tag Name=${EC2_NAME_TAG}"
            RESOLVED="$(resolve_by_name_tag)"
            if [[ -z "${RESOLVED}" || "${RESOLVED}" == "None" ]]; then
              echo "::error::No EC2 instance found with tag Name=${EC2_NAME_TAG}." >&2
              exit 1
            fi
            EC2_INSTANCE_ID="${RESOLVED}"
            STATE="$(instance_state "${EC2_INSTANCE_ID}")"
          fi

          if [[ "${STATE}" == "stopped" ]]; then
            echo "Starting stopped instance ${EC2_INSTANCE_ID}..."
            aws ec2 start-instances --region "${AWS_REGION}" --instance-ids "${EC2_INSTANCE_ID}" >/dev/null
            aws ec2 wait instance-running --region "${AWS_REGION}" --instance-ids "${EC2_INSTANCE_ID}"
          fi

          PING_STATUS="None"
          for attempt in $(seq 1 36); do
            PING_STATUS="$(aws ssm describe-instance-information \
              --region "${AWS_REGION}" \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "Unknown")"
            PING_STATUS="${PING_STATUS:-None}"
            echo "SSM PingStatus for ${EC2_INSTANCE_ID}: ${PING_STATUS} (attempt ${attempt}/36)"
            if [[ "${PING_STATUS}" == "Online" ]]; then
              break
            fi
            sleep 10
          done

          if [[ "${PING_STATUS}" != "Online" ]]; then
            echo "::error::EC2 instance is not Online in SSM (status=${PING_STATUS})." >&2
            exit 1
          fi

          EC2_HOST="$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)"
          echo "Using EC2 instance ${EC2_INSTANCE_ID} (${EC2_HOST})"
          echo "ec2_instance_id=${EC2_INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "ec2_host=${EC2_HOST}" >> "$GITHUB_OUTPUT"

      - name: Upload deploy artifacts to S3
        run: |
          set -euo pipefail
          DEPLOY_BUCKET="${{ steps.deploy_cfg.outputs.deploy_bucket }}"
          aws s3 cp "${{ steps.jar.outputs.path }}" "s3://${DEPLOY_BUCKET}/${DEPLOY_OBJECT_KEY}"
          aws s3 cp deploy/scripts/remote-deploy.sh "s3://${DEPLOY_BUCKET}/${DEPLOY_SCRIPT_KEY}"
          aws s3 cp deploy/scripts/sync-rds-env-from-ssm.sh "s3://${DEPLOY_BUCKET}/${DEPLOY_SYNC_SCRIPT_KEY}"

      - name: Deploy on EC2 via SSM
        run: |
          set -euo pipefail
          DEPLOY_BUCKET="${{ steps.deploy_cfg.outputs.deploy_bucket }}"
          EC2_INSTANCE_ID="${{ steps.ec2_target.outputs.ec2_instance_id }}"

          python3 <<'PY' > /tmp/ssm-deploy-params.json
          import json
          import os

          app_path = os.environ["APP_PATH"]
          bucket = os.environ["DEPLOY_BUCKET"]
          jar_key = os.environ["DEPLOY_OBJECT_KEY"]
          script_key = os.environ["DEPLOY_SCRIPT_KEY"]

          sync_script_key = os.environ["DEPLOY_SYNC_SCRIPT_KEY"]

          commands = [
              "set -euxo pipefail",
              f"mkdir -p {app_path}/incoming {app_path}/scripts {app_path}/app {app_path}/backup {app_path}/logs {app_path}/config",
              f"aws s3 cp s3://{bucket}/{sync_script_key} {app_path}/scripts/sync-rds-env-from-ssm.sh",
              f"aws s3 cp s3://{bucket}/{script_key} {app_path}/scripts/remote-deploy.sh",
              f"aws s3 cp s3://{bucket}/{jar_key} {app_path}/incoming/gamya-couture.jar.new",
              f"chmod 755 {app_path}/scripts/sync-rds-env-from-ssm.sh {app_path}/scripts/remote-deploy.sh",
              f"sudo bash {app_path}/scripts/sync-rds-env-from-ssm.sh {app_path}/config/application.env",
              f"sudo APP_PATH={app_path} bash {app_path}/scripts/remote-deploy.sh",
          ]
          print(json.dumps({"commands": commands}))
          PY

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions backend deploy" \
            --parameters file:///tmp/ssm-deploy-params.json \
            --query 'Command.CommandId' --output text)

          for attempt in $(seq 1 36); do
            INVOCATION=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --output json 2>/dev/null || echo '{}')
            STATUS=$(echo "$INVOCATION" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('Status','Pending'))")
            echo "SSM status: ${STATUS} (attempt ${attempt}/36)"
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '[StandardOutputContent,StandardErrorContent]' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM deploy command ${STATUS}" >&2
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "SSM deploy timed out" >&2
          exit 1
        env:
          DEPLOY_BUCKET: ${{ steps.deploy_cfg.outputs.deploy_bucket }}
          APP_PATH: ${{ env.APP_PATH }}
          DEPLOY_OBJECT_KEY: ${{ env.DEPLOY_OBJECT_KEY }}
          DEPLOY_SCRIPT_KEY: ${{ env.DEPLOY_SCRIPT_KEY }}
          DEPLOY_SYNC_SCRIPT_KEY: ${{ env.DEPLOY_SYNC_SCRIPT_KEY }}

      - name: Verify public health via nginx
        run: |
          EC2_HOST="${{ steps.ec2_target.outputs.ec2_host }}"
          HEALTH_URL="http://${EC2_HOST}/actuator/health"
          for attempt in $(seq 1 24); do
            RESPONSE="$(curl -sS "$HEALTH_URL" || true)"
            if echo "$RESPONSE" | grep -q '"status":"UP"'; then
              echo "Public health check passed"
              exit 0
            fi
            echo "Attempt ${attempt}/24 — response: ${RESPONSE:-<empty>}"
            sleep 5
          done
          echo "::error::Public health check failed." >&2
          exit 1

      - name: Run API smoke tests
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          chmod +x scripts/smoke-test-api.sh
          ./scripts/smoke-test-api.sh "http://${{ steps.ec2_target.outputs.ec2_host }}"
