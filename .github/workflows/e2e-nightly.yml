name: E2E Nightly

on:
  schedule:
    # 02:30 UTC — within dev EC2/RDS morning window (IST ~8:00 AM) when E2E_TARGET=dev
    - cron: "30 2 * * 1-5"
  workflow_dispatch:
    inputs:
      target:
        description: "local = spin up stack in CI; dev = hit remote E2E_BASE_URL secret"
        required: true
        default: local
        type: choice
        options:
          - local
          - dev

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  e2e-full:
    name: Playwright full suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gamya_couture
          POSTGRES_USER: gamya
          POSTGRES_PASSWORD: gamya_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamya -d gamya_couture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_RUN: "1"
      E2E_TARGET: ${{ github.event.inputs.target || 'local' }}
      E2E_BASE_URL: ${{ github.event.inputs.target == 'dev' && secrets.E2E_BASE_URL != '' && secrets.E2E_BASE_URL || 'http://127.0.0.1:3000' }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || 'admin@gamyacouture.com' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'Admin@123' }}
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://localhost:5432/gamya_couture
      DB_USER: gamya
      DB_PASSWORD: gamya_secret
      JWT_SECRET: ci-e2e-jwt-secret-min-32-chars-long
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_PROXY_TARGET: http://127.0.0.1:8080
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_IMAGE_CDN_HOST: d2568bpd35bq6a.cloudfront.net

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: env.E2E_TARGET == 'local'
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Start local stack (when target=local)
        if: env.E2E_TARGET == 'local'
        run: |
          chmod +x scripts/wait-for-url.sh
          mvn -B -ntp -DskipTests package
          JAR_PATH=$(find target -maxdepth 1 -name 'gamya-couture-*.jar' ! -name '*-original.jar' | head -1)
          nohup java -jar "$JAR_PATH" > backend-e2e.log 2>&1 &
          echo $! > backend-e2e.pid
          ./scripts/wait-for-url.sh http://127.0.0.1:8080/actuator/health 90 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and start frontend (local only)
        if: env.E2E_TARGET == 'local'
        working-directory: frontend
        run: |
          npm run build
          nohup npm run start -- -p 3000 -H 127.0.0.1 > ../frontend-e2e.log 2>&1 &
          echo $! > ../frontend-e2e.pid
          ../scripts/wait-for-url.sh http://127.0.0.1:3000 60 2

      - name: Run full Playwright suite
        working-directory: frontend
        run: npm run test:e2e:full

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log
            frontend-e2e.log
          retention-days: 14
