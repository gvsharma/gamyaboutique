name: Validate

on:
  workflow_call:
    inputs:
      run_e2e_smoke:
        description: Run Playwright smoke suite
        required: false
        type: boolean
        default: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify (compile + unit/integration tests)
        run: mvn -B -ntp verify

      - name: Resolve JAR artifact
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name 'gamya-couture-*.jar' ! -name '*-original.jar' | head -1)
          if [[ -z "$JAR_PATH" || ! -f "$JAR_PATH" ]]; then
            echo "Executable JAR not found" >&2
            exit 1
          fi
          echo "Built ${JAR_PATH} ($(du -h "$JAR_PATH" | cut -f1))"

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          API_PROXY_TARGET: http://127.0.0.1:8080
          NEXT_PUBLIC_SITE_URL: https://example.vercel.app
          NEXT_PUBLIC_IMAGE_CDN_HOST: d2568bpd35bq6a.cloudfront.net
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Trivy filesystem scan (frontend)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
          trivy --version
          trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --scanners vuln frontend

  e2e-smoke:
    name: E2E smoke (Playwright)
    if: ${{ inputs.run_e2e_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gamya_couture
          POSTGRES_USER: gamya
          POSTGRES_PASSWORD: gamya_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamya -d gamya_couture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://localhost:5432/gamya_couture
      DB_USER: gamya
      DB_PASSWORD: gamya_secret
      JWT_SECRET: ci-e2e-jwt-secret-min-32-chars-long
      E2E_RUN: "1"
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_PROXY_TARGET: http://127.0.0.1:8080
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_IMAGE_CDN_HOST: d2568bpd35bq6a.cloudfront.net

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build backend JAR
        run: mvn -B -ntp -DskipTests -Pe2e-seed package

      - name: Start backend
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name 'gamya-couture-*.jar' ! -name '*-original.jar' | head -1)
          nohup java -jar "$JAR_PATH" > backend-e2e.log 2>&1 &
          echo $! > backend-e2e.pid
          chmod +x scripts/wait-for-url.sh
          ./scripts/wait-for-url.sh http://127.0.0.1:8080/actuator/health 90 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run start -- -p 3000 -H 127.0.0.1 > ../frontend-e2e.log 2>&1 &
          echo $! > ../frontend-e2e.pid
          chmod +x ../scripts/wait-for-url.sh
          ../scripts/wait-for-url.sh http://127.0.0.1:3000 60 2

      - name: Run Playwright smoke suite
        working-directory: frontend
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log
            frontend-e2e.log
          retention-days: 7
