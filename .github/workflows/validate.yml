name: Validate

on:
  workflow_call:

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify (compile + unit/integration tests)
        run: mvn -B -ntp verify

      - name: Resolve JAR artifact
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name 'gamya-couture-*.jar' ! -name '*-original.jar' | head -1)
          if [[ -z "$JAR_PATH" || ! -f "$JAR_PATH" ]]; then
            echo "Executable JAR not found" >&2
            exit 1
          fi
          echo "Built ${JAR_PATH} ($(du -h "$JAR_PATH" | cut -f1))"

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          API_PROXY_TARGET: http://127.0.0.1:8080
          NEXT_PUBLIC_SITE_URL: https://example.vercel.app
          NEXT_PUBLIC_IMAGE_CDN_HOST: d2568bpd35bq6a.cloudfront.net
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
