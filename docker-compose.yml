services:
  postgres:
    image: postgres:16-alpine
    container_name: gamya-couture-db
    environment:
      POSTGRES_DB: gamya_couture
      POSTGRES_USER: gamya
      POSTGRES_PASSWORD: gamya_secret
    ports:
      - "5432:5432"
    volumes:
      - gamya_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamya -d gamya_couture"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gamya_pg_data:
