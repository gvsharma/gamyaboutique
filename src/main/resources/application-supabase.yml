# Supabase-hosted PostgreSQL profile for Gamya Couture backend.
# Activate with: SPRING_PROFILES_ACTIVE=supabase
#
# Schema is managed by supabase/migrations (not Flyway).
# Dashboard: https://supabase.com/dashboard/project/nlntrftvzcwtrdenufoi
# Password: Project Settings → Database (never commit the real value).
#
# JDBC tips:
# - Prefer Session mode pooler on IPv4-only hosts (EC2), or direct db.*.supabase.co.
# - Do NOT use Transaction mode pooler — breaks prepared statements / JPA.
# - sslmode=require is mandatory for Supabase.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db.nlntrftvzcwtrdenufoi.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      # Supabase free/pro connection limits are tight; keep pool small on EC2.
      max-lifetime: 1800000
      keepalive-time: 30000
  jpa:
    show-sql: false
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://gamyaboutique.vercel.app}

logging:
  level:
    com.gamyacouture: INFO
