spring:
  application:
    name: gamya-couture
  mvc:
    contentnegotiation:
      # Browsers send Accept: text/html; APIs only serve JSON.
      ignore-accept-header: true
      default-content-type: application/json
      favor-parameter: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamya_couture}
    username: ${DB_USER:gamya}
    password: ${DB_PASSWORD:gamya_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  cache:
    type: simple

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key-here}
      issuer: gamya-couture
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.gamyacouture: INFO
    org.springframework.security: WARN
