spring:
  application:
    name: gamya-couture
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    contentnegotiation:
      # Browsers send Accept: text/html; APIs only serve JSON.
      ignore-accept-header: true
      default-content-type: application/json
      favor-parameter: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamya_couture}
    username: ${DB_USER:gamya}
    password: ${DB_PASSWORD:gamya_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  cache:
    type: simple
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    # EC2 dev runs with MAIL_ENABLED=false but spring.mail.host set — don't fail deploy health.
    mail:
      enabled: ${MAIL_ENABLED:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@gamyacouture.com}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key-here}
      issuer: gamya-couture
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
      remember-me-expiration-ms: ${JWT_REMEMBER_ME_EXPIRATION_MS:2592000000}
  storage:
    s3:
      enabled: ${APP_STORAGE_S3_ENABLED:false}
      bucket: ${APP_STORAGE_S3_BUCKET:}
      region: ${APP_STORAGE_S3_REGION:ap-south-1}
      public-base-url: ${APP_STORAGE_S3_PUBLIC_BASE_URL:}
      key-prefix: ${APP_STORAGE_S3_KEY_PREFIX:products/}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.gamyacouture: INFO
    org.springframework.security: WARN
